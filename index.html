<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作待辦備忘錄 (雲端即時同步版)</title>
    <!-- 引入 Sortable.js 用於滑鼠拖曳排序 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- 引入 Firebase SDK (已帶入你的專案設定) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 你的真實 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyAI_DDZ0Yf3rsymfYrAA-f8gxLTLkGBjN8",
            authDomain: "work-todo-app-ceb3d.firebaseapp.com",
            projectId: "work-todo-app-ceb3d",
            storageBucket: "work-todo-app-ceb3d.firebasestorage.app",
            messagingSenderId: "379361831476",
            appId: "1:379361831476:web:25bec9516769c6ccfdb861",
            measurementId: "G-5CFL3J2DRN"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 將重要函式掛載到 window 讓 HTML 按鈕可以呼叫
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;

        window.dispatchEvent(new Event('firebase-loaded'));
    </script>

    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .btn-history-toggle {
            background-color: #e5e7eb;
            color: #374151;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-history-toggle:hover {
            background-color: #d1d5db;
        }

        .list-container {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            gap: 10px;
            cursor: grab;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: transform 0.1s, box-shadow 0.2s;
            background-color: #eff6ff;
        }

        li:active {
            cursor: grabbing;
        }

        li.sortable-ghost {
            opacity: 0.4;
            background: #e5e7eb !important;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .task-content-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
            flex-wrap: wrap;
        }

        .task-category {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.08);
            font-weight: 500;
            white-space: nowrap;
        }

        .task-text {
            word-break: break-all;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .btn-complete {
            background-color: #d1fae5;
            color: #065f46;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-complete:hover {
            background-color: #a7f3d0;
        }

        .btn-delete {
            background-color: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-delete:hover {
            background-color: rgba(239, 68, 68, 0.2);
        }

        .empty-tip {
            text-align: center;
            color: #9ca3af;
            padding: 20px 0;
        }

        .drag-handle {
            color: rgba(0, 0, 0, 0.3);
            font-size: 1.1rem;
            cursor: grab;
            user-select: none;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            background: white;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        #taskInput {
            flex: 2;
        }

        .category-input-wrapper {
            flex: 1.2;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        #categoryInput {
            width: 100%;
        }

        .btn-sm-action {
            background-color: #e5e7eb;
            color: #374151;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .btn-sm-action:hover {
            background-color: #d1d5db;
        }

        .color-settings {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-label {
            font-size: 0.9rem;
            color: #4b5563;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border-color);
            border-radius: 50%;
        }

        .preset-colors {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .preset-item {
            position: relative;
            display: inline-block;
        }

        .preset-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }

        .preset-btn:hover {
            transform: scale(1.15);
        }

        .preset-btn.active {
            border-color: #1f2937;
            transform: scale(1.15);
        }

        button.btn-add {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button.btn-add:hover {
            opacity: 0.9;
        }

        .preset-tags-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.85rem;
        }

        .tag-pill {
            background: #e5e7eb;
            color: #374151;
            padding: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }

        .tag-pill:hover {
            background: #d1d5db;
        }

        .history-section {
            display: none;
            margin-top: 15px;
            border-top: 2px dashed var(--border-color);
            padding-top: 15px;
        }

        .history-section.active {
            display: block;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .history-header h3 {
            margin: 0;
            font-size: 1.1rem;
            color: #4b5563;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9fafb;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .history-meta {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .history-date {
            color: #6b7280;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>📋 工作待辦清單 (雲端同步)</h1>
        <button class="btn-history-toggle" onclick="toggleHistoryView()" id="historyToggleBtn">查看歷史完成 (0)</button>
    </div>
    
    <div class="list-container">
        <ul id="taskList"></ul>
        <div id="emptyTip" class="empty-tip">從雲端載入中或目前沒有工作...</div>
    </div>

    <div class="history-section" id="historySection">
        <div class="history-header">
            <h3>📜 歷史完成紀錄 (雲端同步)</h3>
            <button class="btn-sm-action" onclick="clearHistory()">清空歷史</button>
        </div>
        <div id="historyListContainer">
            <div class="empty-tip" style="padding: 10px 0;">尚無已完成的歷史紀錄</div>
        </div>
    </div>

    <div class="input-section">
        <div class="input-row">
            <input type="text" id="taskInput" placeholder="輸入新工作內容..." onkeypress="handleKeyPress(event)">
            
            <div class="category-input-wrapper">
                <input type="text" id="categoryInput" placeholder="分組標籤" onkeypress="handleKeyPress(event)">
                <button class="btn-sm-action" onclick="addPresetTag()" title="將分組加入常用標籤">＋常用</button>
            </div>

            <button class="btn-add" onclick="addTask()">新增工作</button>
        </div>

        <div class="preset-tags-bar" id="presetTagsBar">
            <span class="color-label">常用標籤：</span>
        </div>
        
        <div class="color-settings">
            <div class="preset-colors" id="presetContainer">
                <span class="color-label">常用色：</span>
            </div>

            <div class="color-picker-group">
                <span class="color-label">自訂色：</span>
                <input type="color" id="colorPicker" value="#eff6ff" oninput="selectCustomColor(this.value)">
                <button class="btn-sm-action" onclick="addPresetColor()" title="將自訂色加入常用色">＋常用色</button>
            </div>
        </div>
    </div>
</div>

<script>
    let tasks = [];
    let historyTasks = [];
    let presetColors = ['#eff6ff', '#fef2f2', '#ecfdf5', '#fffbeb', '#f5f3ff'];
    let presetTags = ['拍攝', '修圖', '會議', '設計'];
    let selectedColor = '#eff6ff';

    window.addEventListener('firebase-loaded', () => {
        initFirestoreSync();
    });

    function initFirestoreSync() {
        const { db, collection, onSnapshot, query, orderBy } = window;

        // 即時監聽待辦事項
        const qTasks = query(collection(db, "tasks"), orderBy("order", "asc"));
        onSnapshot(qTasks, (snapshot) => {
            tasks = [];
            snapshot.forEach((docSnap) => {
                tasks.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderTasks();
        });

        // 即時監聽歷史紀錄
        const qHistory = query(collection(db, "history"), orderBy("completedDate", "desc"));
        onSnapshot(qHistory, (snapshot) => {
            historyTasks = [];
            snapshot.forEach((docSnap) => {
                historyTasks.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderHistory();
        });
    }

    async function addTask() {
        const input = document.getElementById('taskInput');
        const categoryInput = document.getElementById('categoryInput');
        const text = input.value.trim();
        const category = categoryInput.value.trim();

        if (!text) return;

        const { db, collection, addDoc } = window;
        try {
            await addDoc(collection(db, "tasks"), {
                text: text,
                category: category,
                color: selectedColor,
                order: Date.now(),
                createdAt: new Date().toISOString()
            });
            input.value = '';
            categoryInput.value = '';
        } catch (e) {
            console.error("新增失敗: ", e);
        }
    }

    async function completeTask(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;

        const now = new Date();
        const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const { db, collection, addDoc, deleteDoc, doc } = window;
        try {
            await addDoc(collection(db, "history"), {
                text: task.text,
                category: task.category || '',
                color: task.color || '#eff6ff',
                completedDate: dateStr
            });
            await deleteDoc(doc(db, "tasks", id));
        } catch (e) {
            console.error("完成工作失敗: ", e);
        }
    }

    async function deleteTask(id) {
        if (!confirm('確定要刪除這項工作嗎？')) return;
        const { db, deleteDoc, doc } = window;
        try {
            await deleteDoc(doc(db, "tasks", id));
        } catch (e) {
            console.error("刪除失敗: ", e);
        }
    }

    async function deleteHistory(id) {
        const { db, deleteDoc, doc } = window;
        try {
            await deleteDoc(doc(db, "history", id));
        } catch (e) {
            console.error("刪除歷史失敗: ", e);
        }
    }

    async function clearHistory() {
        if (!confirm('確定要清空所有歷史紀錄嗎？')) return;
        const { db, deleteDoc, doc } = window;
        try {
            for (let item of historyTasks) {
                await deleteDoc(doc(db, "history", item.id));
            }
        } catch (e) {
            console.error("清空歷史失敗: ", e);
        }
    }

    function renderTasks() {
        const taskList = document.getElementById('taskList');
        const emptyTip = document.getElementById('emptyTip');
        taskList.innerHTML = '';

        if (tasks.length === 0) {
            emptyTip.style.display = 'block';
            return;
        } else {
            emptyTip.style.display = 'none';
        }

        tasks.forEach((task) => {
            const li = document.createElement('li');
            li.style.backgroundColor = task.color || '#eff6ff';
            li.setAttribute('data-id', task.id);

            const categoryHtml = task.category 
                ? `<span class="task-category">${escapeHtml(task.category)}</span>` 
                : '';

            li.innerHTML = `
                <div class="task-info">
                    <span class="drag-handle" title="按住拖曳排序">☰</span>
                    <div class="task-content-wrapper">
                        ${categoryHtml}
                        <span class="task-text">${escapeHtml(task.text)}</span>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn-complete" onclick="completeTask('${task.id}')">完成</button>
                    <button class="btn-delete" onclick="deleteTask('${task.id}')">刪除</button>
                </div>
            `;
            taskList.appendChild(li);
        });

        updateHistoryToggleBtn();
    }

    function renderHistory() {
        const container = document.getElementById('historyListContainer');
        container.innerHTML = '';

        if (historyTasks.length === 0) {
            container.innerHTML = '<div class="empty-tip" style="padding: 10px 0;">尚無已完成的歷史紀錄</div>';
            updateHistoryToggleBtn();
            return;
        }

        historyTasks.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.style.borderLeft = `4px solid ${item.color || '#4f46e5'}`;

            const categoryHtml = item.category 
                ? `<span class="task-category">${escapeHtml(item.category)}</span>` 
                : '';

            div.innerHTML = `
                <div class="history-meta">
                    ${categoryHtml}
                    <span style="text-decoration: line-through; color: #4b5563;">${escapeHtml(item.text)}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="history-date">${item.completedDate}</span>
                    <button class="btn-delete" style="padding: 2px 6px; font-size: 0.75rem;" onclick="deleteHistory('${item.id}')">刪除</button>
                </div>
            `;
            container.appendChild(div);
        });

        updateHistoryToggleBtn();
    }

    function renderPresets() {
        const container = document.getElementById('presetContainer');
        container.innerHTML = '<span class="color-label">常用色：</span>';
        presetColors.forEach((color) => {
            const item = document.createElement('div');
            item.className = 'preset-item';
            const btn = document.createElement('div');
            btn.className = `preset-btn ${selectedColor === color ? 'active' : ''}`;
            btn.style.backgroundColor = color;
            btn.onclick = () => { selectedColor = color; document.getElementById('colorPicker').value = color; renderPresets(); };
            item.appendChild(btn);
            container.appendChild(item);
        });
    }

    function selectCustomColor(color) { selectedColor = color; }
    function addPresetColor() {
        const color = document.getElementById('colorPicker').value;
        if (!presetColors.includes(color)) presetColors.push(color);
        selectedColor = color;
        renderPresets();
    }

    function renderPresetTags() {
        const bar = document.getElementById('presetTagsBar');
        bar.innerHTML = '<span class="color-label">常用標籤：</span>';
        presetTags.forEach((tag) => {
            const pill = document.createElement('span');
            pill.className = 'tag-pill';
            pill.innerText = tag;
            pill.onclick = () => { document.getElementById('categoryInput').value = tag; };
            bar.appendChild(pill);
        });
    }

    function addPresetTag() {
        const tagInput = document.getElementById('categoryInput');
        const val = tagInput.value.trim();
        if (val && !presetTags.includes(val)) {
            presetTags.push(val);
            renderPresetTags();
        }
    }

    function toggleHistoryView() {
        document.getElementById('historySection').classList.toggle('active');
    }

    function updateHistoryToggleBtn() {
        document.getElementById('historyToggleBtn').innerText = `查看歷史完成 (${historyTasks.length})`;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') addTask();
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderPresets();
        renderPresetTags();

        const taskList = document.getElementById('taskList');
        Sortable.create(taskList, {
            animation: 150,
            handle: '.task-info',
            onEnd: async function (evt) {
                const movedId = tasks[evt.oldIndex].id;
                tasks.splice(evt.oldIndex, 1);
                tasks.splice(evt.newIndex, 0, { id: movedId });

                const { db, updateDoc, doc } = window;
                for (let i = 0; i < tasks.length; i++) {
                    await updateDoc(doc(db, "tasks", tasks[i].id), { order: i });
                }
            }
        });
    });
</script>

</body>
</html>
